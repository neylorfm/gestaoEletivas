<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    /* Estilização inspirada no Material Design / Google Workspace */
    body {
      font-family: 'Google Sans', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      color: #3c4043;
      background-color: #f8f9fa;
    }
    h2 {
      font-size: 1.3rem;
      font-weight: 500;
      margin-top: 0;
      margin-bottom: 20px;
      color: #202124;
      border-bottom: 2px solid #e8eaed;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 5px;
    }
    input[type="date"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="date"]:focus, select:focus {
      border-color: #1a73e8;
    }
    button {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      margin-top: 10px;
    }
    button:hover {
      background-color: #1765cc;
      box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    }
    button:disabled {
      background-color: #a8c7fa;
      cursor: not-allowed;
      box-shadow: none;
    }
    #status {
      margin-top: 20px;
      font-size: 0.9rem;
      padding: 14px;
      border-radius: 4px;
      display: none;
      line-height: 1.4;
    }
    .status-info {
      background-color: #e8f0fe;
      color: #1967d2;
      border: 1px solid #d2e3fc;
    }
    .status-success {
      background-color: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
    }
    .status-error {
      background-color: #fce8e6;
      color: #c5221f;
      border: 1px solid #fad2cf;
    }
    .radio-group {
      display: flex;
      gap: 15px;
      margin-top: 5px;
    }
    .radio-group label {
      display: inline;
      font-weight: normal;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Gerador de Relatórios</h2>
  
  <div class="form-group">
    <label>Filtrar por:</label>
    <div class="radio-group">
      <div>
        <input type="radio" id="rdoTurma" name="filtroTipo" value="TURMA" checked onchange="trocarFiltro()">
        <label for="rdoTurma">Turma Regular</label>
      </div>
      <div>
        <input type="radio" id="rdoEletiva" name="filtroTipo" value="ELETIVA" onchange="trocarFiltro()">
        <label for="rdoEletiva">Eletiva</label>
      </div>
    </div>
  </div>
  
  <div class="form-group">
    <label id="lblValorFiltro">Selecione a Turma:</label>
    <select id="valorFiltro">
      <option value="">Carregando...</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="dataInicio">Data Inicial:</label>
    <input type="date" id="dataInicio">
  </div>
  
  <div class="form-group">
    <label for="dataFim">Data Final:</label>
    <input type="date" id="dataFim">
  </div>
  
  <button id="btnGerar" onclick="gerar()">Gerar Relatório (Pivot)</button>
  
  <div id="status"></div>

  <script>
    let cacheTurmas = [];
    let cacheEletivas = [];
    
    document.addEventListener("DOMContentLoaded", function() {
      // Configurar datas (últimos 30 dias por padrão)
      let hj = new Date();
      document.getElementById('dataFim').valueAsDate = hj;
      let mesPassado = new Date();
      mesPassado.setDate(hj.getDate() - 30);
      document.getElementById('dataInicio').valueAsDate = mesPassado;
      
      // Carregar listas do backend
      google.script.run
        .withSuccessHandler(function(dados) {
          cacheTurmas = dados.turmas;
          cacheEletivas = dados.eletivas;
          trocarFiltro();
        })
        .withFailureHandler(function(err) {
          mostrarStatus("Erro ao carregar dados: " + err, "error");
        })
        .getDadosEnturmacaoUI();
    });

    function trocarFiltro() {
      let tipo = document.querySelector('input[name="filtroTipo"]:checked').value;
      let select = document.getElementById('valorFiltro');
      let lbl = document.getElementById('lblValorFiltro');
      
      select.innerHTML = '<option value="">Selecione...</option>';
      
      if (tipo === 'TURMA') {
        lbl.innerText = 'Selecione a Turma:';
        cacheTurmas.forEach(t => {
          let opt = document.createElement('option');
          opt.value = t; opt.innerText = t;
          select.appendChild(opt);
        });
      } else {
        lbl.innerText = 'Selecione a Eletiva:';
        // Agrupar eletivas únicas por ID para não repetir (caso configurada em dias múltiplos)
        let unicos = {};
        cacheEletivas.forEach(e => {
          if(!unicos[e.id]) {
            unicos[e.id] = e.nome;
            let opt = document.createElement('option');
            opt.value = e.id; opt.innerText = e.nome;
            select.appendChild(opt);
          }
        });
      }
    }

    function gerar() {
      var tipo = document.querySelector('input[name="filtroTipo"]:checked').value;
      var valor = document.getElementById('valorFiltro').value;
      var dtInicio = document.getElementById('dataInicio').value;
      var dtFim = document.getElementById('dataFim').value;
      
      var btn = document.getElementById('btnGerar');
      
      if (!valor || !dtInicio || !dtFim) {
        mostrarStatus("Por favor, preencha todos os campos.", "error");
        return;
      }
      
      if (new Date(dtInicio) > new Date(dtFim)) {
        mostrarStatus("A data inicial não pode ser maior que a final.", "error");
        return;
      }
      
      var payload = {
        tipo: tipo,
        valor: valor,
        dataInicio: dtInicio,
        dataFim: dtFim
      };
      
      // Estado de loading
      btn.disabled = true;
      btn.innerText = "Processando Dados...";
      mostrarStatus("Construindo tabela pivot, aguarde...", "info");
      
      google.script.run
        .withSuccessHandler(function(resposta) {
          btn.disabled = false;
          btn.innerText = "Gerar Relatório (Pivot)";
          mostrarStatus(resposta, "success");
        })
        .withFailureHandler(function(erro) {
          btn.disabled = false;
          btn.innerText = "Gerar Relatório (Pivot)";
          mostrarStatus("Erro ao gerar: " + erro, "error");
        })
        .gerarRelatorioSecretaria(payload);
    }
    
    // Função utilitária para os balões de alerta
    function mostrarStatus(mensagem, tipo) {
      var statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.innerText = mensagem;
      
      statusDiv.className = ''; // limpa estilos velhos
      
      if (tipo === 'info') statusDiv.classList.add('status-info');
      else if (tipo === 'success') statusDiv.classList.add('status-success');
      else if (tipo === 'error') statusDiv.classList.add('status-error');
    }
  </script>
</body>
</html>
